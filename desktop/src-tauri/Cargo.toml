[package]
name = "blink-counter"
version = "2.0.0"
description = "Cross-platform blink frequency monitor and eye-wellness desktop app"
authors = ["Wu Ruixin"]
license = "MIT"
edition = "2021"

[lib]
name = "blink_counter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
