name: Build & Release Cross-Platform Desktop App (Tauri)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: "macOS Apple Silicon"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            label: "macOS Intel"
          - platform: windows-latest
            args: ""
            label: "Windows x64"
          - platform: ubuntu-22.04
            args: ""
            label: "Linux x64"

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.label }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install Linux WebKitGTK / AppImage dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop CLI dependencies
        working-directory: desktop
        run: npm install

      - name: Bundle offline MediaPipe WASM & FaceLandmarker model
        working-directory: desktop
        run: python scripts/fetch_vendor.py

      - name: Build & Upload Tauri Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          releaseName: "Blink Counter ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          releaseBody: |
            ## 👁️ Blink Counter — Cross-Platform Eye Wellness Desktop App

            Lightweight (~10–15 MB), 100% free, 100% on-device blink frequency & eye-care companion with offline AI model bundled inside.

            ### Downloads
            - **macOS (Apple Silicon M1/M2/M3/M4)**: `Blink Counter_*_aarch64.dmg`
            - **macOS (Intel)**: `Blink Counter_*_x64.dmg`
            - **Windows (64-bit)**: `Blink Counter_*_x64-setup.exe` or `.msi`
            - **Linux (64-bit)**: `Blink Counter_*_amd64.AppImage` or `.deb`

            ### Highlights
            - **System Tray / Menu Bar Residency**: Close window to keep protecting your eyes quietly in the background with zero video rendering.
            - **Always-On-Top Eye-Care Alerts & Sound Melodies**: Unmissable pop-up dialogs + OS notifications for low blink rate & 20-20-20 far-gaze breaks.
            - **Ultra-Low Battery Eco Mode**: 15 FPS cap, minimized zero-render mode, 1.5 FPS idle backoff, and optional duty-cycle camera sleep.
            - **Multi-Language**: English, 简体中文, 日本語, Español.
            - **100% Free & Offline**: Zero cloud uploads, zero subscriptions.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
